  if (tab === 'list'){
    box.innerHTML = DATA.map(card).join('');
    cnt.textContent = '全' + DATA.length + '種（番号順）';
    return;
  }
  if (tab === 'fam'){
    var groups = {}, order = [];
    DATA.forEach(function(it){ if (it.family){ if (!groups[it.family]){ groups[it.family] = []; order.push(it.family); } groups[it.family].push(it); } });
    var singles = DATA.filter(function(it){ return !it.family; });
    var h = '';
    order.forEach(function(g){
      h += '<div class="fam-head">' + g + '</div>';
      h += groups[g].map(function(it){
        var c = card(it);
        if (it.familyRole) c = c.replace('</div></div>', '<span class="fam-role">' + it.familyRole + '</span></div></div>');
        return c;
      }).join('');
    });
    h += '<div class="fam-head">括りのない処方</div>' + singles.map(card).join('');
    box.innerHTML = h;
    cnt.textContent = '';
    bindFam();
    return;
  }
  var q = document.getElementById('q').value.trim();
  var list = DATA.filter(function(it){
    if (selSym && !it.symptoms.some(function(s){ return s.indexOf(selSym) >= 0; })) return false;
    if (selConst && !(it.constitution || []).join('').indexOf(selConst) >= 0 && !(it.constitution || []).some(function(c){ return c.indexOf(selConst) >= 0; })) return false;
    if (q){
      var hay = it.name + it.reading + it.symptoms.join(' ');
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  box.innerHTML = list.length ? list.map(card).join('') : '<p class="count">見つかりませんでした。言葉を変えてみてくださいね。</p>';
  cnt.textContent = list.length + '件';
  bindFam();
}
function bindFam(){
  document.querySelectorAll('.c-fam').forEach(function(el){
    el.addEventListener('click', function(){
      tab = 'fam';
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('on', t.dataset.tab === 'fam'); });
      render();
      window.scrollTo({top: 0, behavior: 'smooth'});
    });
  });
}
var sc = document.getElementById('symChips');
SYM_CHIPS.forEach(function(s){
  var b = document.createElement('button');
  b.className = 'chip'; b.textContent = s;
  b.addEventListener('click', function(){
    selSym = (selSym === s) ? null : s;
    sc.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('on', c.textContent === selSym); });
    render();
  });
  sc.appendChild(b);
});
var cc = document.getElementById('constChips');
CONSTS.forEach(function(s){
  var b = document.createElement('button');
  b.className = 'chip'; b.textContent = s;
  b.addEventListener('click', function(){
    selConst = (selConst === s) ? null : s;
    cc.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('on', c.textContent === selConst); });
    render();
  });
  cc.appendChild(b);
});
document.getElementById('q').addEventListener('input', render);
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    tab = t.dataset.tab;
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('on', x === t); });
    render();
  });
});
render();
</script>
