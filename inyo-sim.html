<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陰陽シミュレーター｜集まれ水女子の森</title>
<meta name="description" content="丸いかたまりに陽と陰を足して、見え方の変わり方を目で感じる体験コーナーです。大きさ・形・密度の量は、それぞれ混ざり合います。">
<link rel="canonical" href="https://mizujoshinomori.pages.dev/inyo-sim">
<meta property="og:title" content="陰陽シミュレーター｜集まれ水女子の森">
<meta property="og:description" content="丸いかたまりに陽と陰を足して、見え方の変わり方を目で感じる体験コーナーです。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mizujoshinomori.pages.dev/inyo-sim">
<meta property="og:image" content="https://mizujoshinomori.pages.dev/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="陰陽シミュレーター｜集まれ水女子の森">
<meta name="twitter:description" content="丸いかたまりに陽と陰を足して、見え方の変わり方を目で感じる体験コーナーです。">
<meta name="twitter:image" content="https://mizujoshinomori.pages.dev/ogp.jpg">
<style>
  :root{ --ink:#2f3a2f; --sub:#4d5c4d; --green:#4a7c59; --green-deep:#33513c; --line:#dce8d8; --card:#ffffff; --bg:#f4f8f1;
    --yin:#2f6fb2; --yin-bg:#e3eef8; --yo:#c1440e; --yo-bg:#fbe9dd; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;-webkit-text-size-adjust:100%;font-size:16.5px;}
  .wrap{max-width:680px;margin:0 auto;padding:10px 14px 40px;}
  .back{display:inline-block;padding:6px 4px;font-size:15px;font-weight:700;color:var(--green);text-decoration:none;min-height:48px;line-height:36px;}
  header{text-align:center;margin:0;}
  .badge{display:inline-block;background:var(--yo);color:#fff;font-weight:900;font-size:16px;letter-spacing:.04em;border-radius:999px;padding:5px 20px;line-height:1.6;}
  h1{font-size:22px;font-weight:900;color:var(--green-deep);margin-top:5px;line-height:1.4;}
  .lead{text-align:center;font-size:16px;color:var(--ink);margin:3px 0 6px;line-height:1.7;}
  .stage-card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px 8px 4px;}
  #stage{display:block;width:min(198px,58%);height:auto;margin:0 auto;}
  .arrows{opacity:0;}
  .arrows.flash{animation:arrowFlash 1.05s ease-out;}
  @keyframes arrowFlash{0%{opacity:0}22%{opacity:.95}100%{opacity:0}}
  .msg{text-align:center;font-size:16px;font-weight:800;color:var(--green-deep);line-height:1.75;min-height:56px;padding:5px 10px 2px;display:flex;align-items:center;justify-content:center;}
  .gauge-box{margin-top:9px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:6px 12px 7px;}
  .gauge-scale{display:flex;justify-content:space-between;margin:0 8px 2px calc(3.2em + 18px);font-size:14px;font-weight:900;line-height:1.5;}
  .gauge-scale .gl-yin{color:var(--yin);}
  .gauge-scale .gl-chu{color:var(--green-deep);}
  .gauge-scale .gl-yo{color:var(--yo);}
  .gauge-row{display:flex;align-items:center;gap:10px;padding:3px 8px;border:2px solid transparent;border-radius:12px;margin-top:2px;min-height:48px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .gauge-row.active{border-color:var(--green);background:#eef5e9;}
  .gauge-name{flex:0 0 3.2em;font-size:16px;font-weight:900;color:var(--sub);line-height:1.6;}
  .gauge-row.active .gauge-name{color:var(--green-deep);}
  .gauge-bar{position:relative;flex:1;height:14px;border-radius:999px;background:linear-gradient(90deg,#5b9bd5 0%,#cfe2f2 28%,#e9efd9 50%,#f6c48a 74%,#c1440e 100%);touch-action:none;cursor:pointer;}
  .gauge-bar::before{content:"";position:absolute;left:0;right:0;top:-13px;bottom:-13px;}
  .gauge-dot{position:absolute;top:50%;left:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--green-deep);transform:translate(-50%,-50%);}
  .add-row{display:flex;gap:12px;margin-top:10px;}
  .add-btn{flex:1;min-height:60px;border-radius:16px;border:2px solid;font-family:inherit;font-size:19px;font-weight:900;cursor:pointer;line-height:1.4;padding:8px 6px;}
  .add-btn small{display:block;font-size:13.5px;font-weight:700;}
  .add-yin{background:var(--yin-bg);border-color:var(--yin);color:var(--yin);}
  .add-yo{background:var(--yo-bg);border-color:var(--yo);color:var(--yo);}
  .add-btn:active{transform:scale(.98);}
  .reset-row{text-align:center;margin-top:8px;}
  .reset-btn{min-height:48px;padding:6px 26px;border-radius:999px;border:2px solid var(--green);background:#fff;color:var(--green-deep);font-family:inherit;font-size:16px;font-weight:900;cursor:pointer;}
  .reset-btn:active{transform:scale(.98);}
  .endbox{text-align:center;margin-top:26px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:22px 18px 18px;}
  .keeper-end{display:block;width:180px;height:auto;margin:0 auto 10px;border-radius:24px;}
  .endbox .words{font-size:16.5px;line-height:2.0;}
  .to-links{text-align:center;margin-top:22px;}
  .to-links a{display:inline-block;padding:10px 8px;font-size:15.5px;font-weight:700;color:var(--green);text-decoration:none;min-height:48px;}
  .note{margin-top:26px;font-size:13.5px;color:var(--sub);text-align:center;line-height:2.0;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 森へもどる</a>
  <header>
    <span class="badge">☯ 陰陽メガネ 👓</span>
    <h1>陰陽シミュレーター</h1>
  </header>

  <p class="lead">丸いかたまりに、陽と陰を足してみましょう。</p>

  <div class="stage-card">
    <svg id="stage" viewBox="0 0 320 320" role="img" aria-label="陰陽で形が変わる、丸いかたまり">
      <defs>
        <radialGradient id="blobGrad" cx="42%" cy="38%" r="78%">
          <stop id="gs0" offset="0%" stop-color="#f7f2df"/>
          <stop id="gs1" offset="70%" stop-color="#f3ecd6"/>
          <stop id="gs2" offset="100%" stop-color="#b0c49e"/>
        </radialGradient>
        <filter id="soften" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="7"/>
        </filter>
      </defs>
      <path id="halo" filter="url(#soften)" fill="#b0c49e" opacity="0"/>
      <g id="blobG">
        <path id="blob" fill="url(#blobGrad)" stroke="#6e8c5f" stroke-width="3" stroke-linejoin="round"/>
      </g>
      <g id="arrowsIn" class="arrows" stroke="#c1440e" fill="#c1440e"></g>
      <g id="arrowsOut" class="arrows" stroke="#2f6fb2" fill="#2f6fb2"></g>
    </svg>
    <p class="msg" id="msg">真ん中（中庸）の状態です。<br>陽と陰を足すと、どう変わるでしょう。</p>
  </div>

  <div class="gauge-box">
    <div class="gauge-scale"><span class="gl-yin">極陰</span><span class="gl-chu">中庸</span><span class="gl-yo">極陽</span></div>
    <div class="gauge-row active" data-axis="size" role="button" tabindex="0" aria-pressed="true" aria-label="物差しを「大きさ」にする"><span class="gauge-name">大きさ</span><div class="gauge-bar"><div class="gauge-dot" id="dotSize"></div></div></div>
    <div class="gauge-row" data-axis="shape" role="button" tabindex="0" aria-pressed="false" aria-label="物差しを「形」にする"><span class="gauge-name">形</span><div class="gauge-bar"><div class="gauge-dot" id="dotShape"></div></div></div>
    <div class="gauge-row" data-axis="density" role="button" tabindex="0" aria-pressed="false" aria-label="物差しを「密度」にする"><span class="gauge-name">密度</span><div class="gauge-bar"><div class="gauge-dot" id="dotDensity"></div></div></div>
  </div>

  <div class="add-row">
    <button type="button" class="add-btn add-yin" id="btnYin">陰を足す<small>中心に集まる力が弱い</small></button>
    <button type="button" class="add-btn add-yo" id="btnYo">陽を足す<small>中心に集まる力が強い</small></button>
  </div>
  <div class="reset-row">
    <button type="button" class="reset-btn" id="btnReset">真ん中にもどす</button>
  </div>

  <div class="endbox">
    <img class="keeper-end" loading="lazy" src="quiz-keeper-glasses.webp" alt="陰陽メガネをかけた森の番人" width="640" height="640" style="height:auto">
    <p class="words">陰陽のイメージ、つかめたかな？</p>
  </div>

  <div class="to-links">
    <a href="inyo-quiz.html">陰陽クイズで練習する →</a><br>
    <a href="inyo.html">食の陰陽辞典へ →</a>
  </div>

  <p class="note">陰陽は、比べる物差しで見え方が変わります。<br>どちらか片方だけが良い・悪い、という見方ではありません。</p>
</div>

<script>
(function(){
  "use strict";
  var CX=160, CY=160, R=92, N=16;
  /* 物差しごとに独立した量（-5〜+5）。切り替えても消えず、見た目は3つの合成 */
  var amt={ size:0, shape:0, density:0 };
  var amtCur={ size:0, shape:0, density:0 };
  var ruler="size";
  var AXES=["size","shape","density"];
  var blob=document.getElementById("blob"),
      halo=document.getElementById("halo"),
      blobG=document.getElementById("blobG"),
      gs0=document.getElementById("gs0"),
      gs1=document.getElementById("gs1"),
      gs2=document.getElementById("gs2"),
      msg=document.getElementById("msg"),
      dots={ size:document.getElementById("dotSize"),
             shape:document.getElementById("dotShape"),
             density:document.getElementById("dotDensity") },
      arrowsIn=document.getElementById("arrowsIn"),
      arrowsOut=document.getElementById("arrowsOut");
  var gaugeRows=document.querySelectorAll(".gauge-row");

  /* 矢印を描く（対角4方向） */
  var SVGNS="http://www.w3.org/2000/svg";
  function buildArrows(g, inward){
    var dirs=[[1,-1],[-1,-1],[-1,1],[1,1]];
    dirs.forEach(function(d){
      var len=Math.hypot(d[0],d[1]), ux=d[0]/len, uy=d[1]/len;
      var r1=inward?158:106, r2=inward?110:154;
      var x1=CX+ux*r1, y1=CY+uy*r1, x2=CX+ux*r2, y2=CY+uy*r2;
      var sgn=inward?-1:1;
      var vx=ux*sgn, vy=uy*sgn;      /* 矢印の向く単位ベクトル */
      var hl=30, hw=16;              /* 頭（三角形）：長さ30・半幅16 */
      var hx=x2, hy=y2;              /* 先端＝三角形の頂点 */
      var bx=hx-vx*hl, by=hy-vy*hl;  /* 三角形の底辺の中心 */
      /* 軸は底辺で止め、頭の中に少しだけ埋める（先端から突き出さない） */
      var ex=bx+vx*(hl*0.35), ey=by+vy*(hl*0.35);
      var line=document.createElementNS(SVGNS,"line");
      line.setAttribute("x1",x1); line.setAttribute("y1",y1);
      line.setAttribute("x2",ex); line.setAttribute("y2",ey);
      line.setAttribute("stroke-width","9"); line.setAttribute("stroke-linecap","round");
      g.appendChild(line);
      var px=-uy, py=ux;
      var poly=document.createElementNS(SVGNS,"polygon");
      poly.setAttribute("points", hx+","+hy+" "+(bx+px*hw)+","+(by+py*hw)+" "+(bx-px*hw)+","+(by-py*hw));
      poly.setAttribute("stroke","none");
      g.appendChild(poly);
    });
  }
  buildArrows(arrowsIn, true);
  buildArrows(arrowsOut, false);
  function flash(g){
    g.classList.remove("flash");
    void g.getBoundingClientRect();
    g.classList.add("flash");
  }
  /* ゲージ操作用の矢印表示：向きが変わった時か、前回から少し間が空いた時だけ出す（スライド中の点滅防止） */
  var lastFlashT=0, lastFlashDir=0;
  function flashGauge(dir){
    var now=(window.performance&&performance.now)?performance.now():Date.now();
    if(dir===lastFlashDir && now-lastFlashT<700) return;
    lastFlashDir=dir; lastFlashT=now;
    flash(dir>0?arrowsIn:arrowsOut);
  }

  /* かたまりの輪郭（有機的な丸。wob=うねりの強さ：0でまん丸） */
  function blobPath(size, wob){
    var pts=[], i, th, w, r;
    for(i=0;i<N;i++){
      th=i/N*Math.PI*2;
      w=1+wob*(0.030*Math.sin(2*th+1.3)+0.020*Math.sin(3*th+0.6)+0.012*Math.sin(5*th+2.1));
      r=R*size*w;
      pts.push([CX+Math.cos(th)*r, CY+Math.sin(th)*r]);
    }
    var d="M"+pts[0][0].toFixed(1)+","+pts[0][1].toFixed(1);
    for(i=0;i<N;i++){
      var p0=pts[(i-1+N)%N], p1=pts[i], p2=pts[(i+1)%N], p3=pts[(i+2)%N];
      var c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
      var c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
      d+="C"+c1x.toFixed(1)+","+c1y.toFixed(1)+" "+c2x.toFixed(1)+","+c2y.toFixed(1)+" "+p2[0].toFixed(1)+","+p2[1].toFixed(1);
    }
    return d+"Z";
  }

  /* 色の補間 */
  function mixc(c1,c2,t){ return [0,1,2].map(function(i){ return Math.round(c1[i]+(c2[i]-c1[i])*t); }); }
  function rgb(c){ return "rgb("+c[0]+","+c[1]+","+c[2]+")"; }
  var COL={
    mid:  { core:[247,242,223], edge:[176,196,158], stroke:[110,140,95] },
    yo:   { core:[250,196,120], edge:[199,72,20],   stroke:[138,47,8] },
    yin:  { core:[219,236,251], edge:[110,164,216], stroke:[47,111,178] }
  };
  function colorSet(mix){
    var t=mix>=0?mix:-mix, dst=mix>=0?COL.yo:COL.yin;
    return {
      core: mixc(COL.mid.core, dst.core, t),
      edge: mixc(COL.mid.edge, dst.edge, t),
      stroke: mixc(COL.mid.stroke, dst.stroke, t)
    };
  }

  /* 3つの量 → 見た目の合成（軸ごとに担当する要素が1つずつ） */
  function visualFor(v){
    var t={ size:1, sx:1, sy:1, wob:1, mix:0, soft:0, sw:3 };
    /* 大きさ：サイズだけ（大きいほど陽） */
    t.size=1+0.105*v.size;
    /* 形：陽でまん丸、陰で縦長。面積の印象は変えない */
    if(v.shape>0){ t.wob=1-v.shape/5; }
    else if(v.shape<0){ t.sy=1+(-v.shape)*0.105; t.sx=1/Math.sqrt(t.sy); }
    /* 密度：色の濃さと輪郭だけ */
    t.mix=v.density/5;
    t.soft=Math.max(0,-v.density)/5;
    t.sw=3+Math.max(0,v.density)*0.55;
    return t;
  }
  var rafId=null;

  function render(){
    var cur=visualFor(amtCur);
    var d=blobPath(cur.size, cur.wob);
    blob.setAttribute("d", d);
    halo.setAttribute("d", d);
    /* 大きさ×形が重なっても画面からはみ出さないよう、全体を少し縮める保険 */
    var ext=R*cur.size*Math.max(cur.sx, cur.sy);
    var f=Math.min(1, 148/Math.max(ext,1));
    var tf="translate("+CX+" "+CY+") scale("+(cur.sx*f).toFixed(4)+" "+(cur.sy*f).toFixed(4)+") translate("+(-CX)+" "+(-CY)+")";
    blobG.setAttribute("transform", tf);
    halo.setAttribute("transform", "translate("+CX+" "+CY+") scale("+(cur.sx*1.07*f).toFixed(4)+" "+(cur.sy*1.07*f).toFixed(4)+") translate("+(-CX)+" "+(-CY)+")");
    var cs=colorSet(cur.mix);
    gs0.setAttribute("stop-color", rgb(mixc(cs.core,[255,255,255],0.35)));
    gs1.setAttribute("stop-color", rgb(cs.core));
    gs2.setAttribute("stop-color", rgb(cs.edge));
    gs2.setAttribute("stop-opacity", (1-cur.soft*0.55).toFixed(3));
    blob.setAttribute("stroke", rgb(cs.stroke));
    blob.setAttribute("stroke-opacity", (1-cur.soft*0.5).toFixed(3));
    blob.setAttribute("stroke-width", cur.sw.toFixed(2));
    halo.setAttribute("fill", rgb(cs.edge));
    halo.setAttribute("opacity", (cur.soft*0.4).toFixed(3));
    AXES.forEach(function(ax){
      dots[ax].style.left=((amtCur[ax]+5)/10*100)+"%";
    });
  }
  function tick(){
    var done=true, i, ax;
    for(i=0;i<AXES.length;i++){
      ax=AXES[i];
      amtCur[ax]+=(amt[ax]-amtCur[ax])*0.075;
      if(Math.abs(amt[ax]-amtCur[ax])>0.003) done=false;
    }
    render();
    if(!done){ rafId=requestAnimationFrame(tick); }
    else {
      AXES.forEach(function(a2){ amtCur[a2]=amt[a2]; });
      render(); rafId=null;
    }
  }
  function animate(){
    if(rafId===null) rafId=requestAnimationFrame(tick);
  }

  var MSG={
    size:   { p:"陽が増えると、どんどん<br>大きくなります。", n:"陰が増えると、だんだん<br>小さくなります。" },
    shape:  { p:"陽が増えると、ギュッとまん丸に<br>集まります。", n:"陰が増えると、ふわっと縦に<br>伸びていきます。" },
    density:{ p:"陽が増えると、色が濃く、<br>輪郭がくっきりしてきます。", n:"陰が増えると、色が薄く、<br>輪郭がふわっとやわらかくなります。" },
    zero:   "真ん中（中庸）の状態です。<br>陽と陰を足すと、どう変わるでしょう。"
  };
  var NAMES={ size:"大きさ", shape:"形", density:"密度" };
  function updateMsg(){
    var v=amt[ruler];
    if(v===0){
      if(amt.size===0 && amt.shape===0 && amt.density===0){ msg.innerHTML=MSG.zero; }
      else { msg.innerHTML=NAMES[ruler]+"は、真ん中（中庸）です。<br>他の物差しの量と、混ざっています。"; }
      return;
    }
    msg.innerHTML = v>0 ? MSG[ruler].p : MSG[ruler].n;
  }
  function apply(){
    updateMsg();
    animate();
  }

  document.getElementById("btnYo").addEventListener("click", function(){
    if(amt[ruler]<5){ amt[ruler]+=1; flash(arrowsIn); }
    apply();
  });
  document.getElementById("btnYin").addEventListener("click", function(){
    if(amt[ruler]>-5){ amt[ruler]-=1; flash(arrowsOut); }
    apply();
  });
  document.getElementById("btnReset").addEventListener("click", function(){
    amt.size=0; amt.shape=0; amt.density=0; apply();
  });
  function syncRulerUI(){
    gaugeRows.forEach(function(row){
      var on=row.getAttribute("data-axis")===ruler;
      row.classList.toggle("active", on);
      row.setAttribute("aria-pressed", on?"true":"false");
    });
  }
  function setRuler(axis){
    ruler=axis;
    syncRulerUI();
    updateMsg();
  }
  gaugeRows.forEach(function(row){
    row.addEventListener("click", function(){
      setRuler(row.getAttribute("data-axis"));
    });
    row.addEventListener("keydown", function(e){
      if(e.key==="Enter" || e.key===" "){ e.preventDefault(); setRuler(row.getAttribute("data-axis")); }
    });
  });

  /* ゲージを指でスライドして、その軸の量を直接変える（タップ位置への移動も含む） */
  document.querySelectorAll(".gauge-bar").forEach(function(bar){
    var axis=bar.parentElement.getAttribute("data-axis");
    var dragging=false;
    function setFromEvent(e){
      var rect=bar.getBoundingClientRect();
      var frac=(e.clientX-rect.left)/rect.width;
      if(frac<0) frac=0;
      if(frac>1) frac=1;
      var nv=Math.round(frac*10-5);
      var ov=amt[axis];
      amt[axis]=nv;
      amtCur[axis]=amt[axis];
      /* 値が変わった時だけ、増えた向きの矢印を出す（ボタン操作と同じ見せ方） */
      if(nv>ov) flashGauge(1);
      else if(nv<ov) flashGauge(-1);
      updateMsg();
      render();
      animate();
    }
    bar.addEventListener("pointerdown", function(e){
      e.preventDefault();
      dragging=true;
      try{ bar.setPointerCapture(e.pointerId); }catch(err){}
      setRuler(axis);
      setFromEvent(e);
    });
    bar.addEventListener("pointermove", function(e){
      if(dragging) setFromEvent(e);
    });
    bar.addEventListener("pointerup", function(){ dragging=false; });
    bar.addEventListener("pointercancel", function(){ dragging=false; });
  });

  syncRulerUI();
  render();
})();
</script>
</body>
</html>
