<script>
var DATA = [{"n": "立春", "r": "りっしゅん", "m": 2, "d": 4, "body": "寒さの中に、春の気配が立ち始める頃です。体は冬の緊張から緩み始めて、自律神経が揺れやすくなります。", "tips": ["朝の光を浴びてみてくださいね", "体を軽く伸ばして、巡りを促しましょう", "苦みのある春野菜を、少しだけ取り入れてみてくださいね"], "food": "菜の花、ふきのとう"}, {"n": "雨水", "r": "うすい", "m": 2, "d": 19, "body": "雪が雨に変わる頃です。湿気と冷えが混ざって、むくみやすくなります。", "tips": ["足首を温めてあげてくださいね", "飲み物は、温かいものがおすすめです", "早めに休んで、体を休ませてあげましょう"], "food": "キャベツ、柑橘類"}, {"n": "啓蟄", "r": "けいちつ", "m": 3, "d": 5, "body": "虫たちが目覚める頃です。気温差と花粉で、体が敏感になりやすくなります。", "tips": ["帰宅したら、手洗いとうがいをどうぞ", "深呼吸で、気持ちをゆるめてみてくださいね", "酸味のあるもので、気分転換もおすすめです"], "food": "新玉ねぎ、いちご"}, {"n": "春分", "r": "しゅんぶん", "m": 3, "d": 20, "body": "昼と夜の長さが同じになる日です。心と体のバランスを整えるのに、よい節目です。", "tips": ["朝晩の気温差には、薄手の重ね着をどうぞ", "ぼんやり空を見る時間も、大切にしてくださいね", "温かい汁物で、お腹を温めてあげましょう"], "food": "たけのこ、よもぎ"}, {"n": "清明", "r": "せいめい", "m": 4, "d": 5, "body": "空気が清々しくなる頃です。新しい環境で、知らず知らず緊張しやすくなります。", "tips": ["肩の力を抜いて、深呼吸してみてくださいね", "緑の景色を見ると、気持ちがゆるみます", "温かい食事を、ゆっくりどうぞ"], "food": "新じゃがいも、よもぎ"}, {"n": "穀雨", "r": "こくう", "m": 4, "d": 20, "body": "雨が増えて、湿気が体にたまりやすい頃です。体が重だるく感じやすくなります。", "tips": ["お部屋の換気をしてみてくださいね", "体をよく動かして、巡りを促しましょう", "豆類は、水分のバランスを助けてくれます"], "food": "そら豆、グリーンピース"}, {"n": "立夏", "r": "りっか", "m": 5, "d": 5, "body": "夏の始まりです。汗ばむ日が増えて、少しずつ体力を使う季節になります。", "tips": ["汗をかいたら、着替えてあげてくださいね", "水分は、こまめにどうぞ", "苦みのある野菜は、体の熱を冷ましてくれます"], "food": "そら豆、トマト"}, {"n": "小満", "r": "しょうまん", "m": 5, "d": 21, "body": "陽気が満ちてくる頃です。胃腸が疲れやすくなります。", "tips": ["食事は腹八分目がおすすめです", "冷たいものの摂りすぎには、気をつけてくださいね", "湯船に浸かって、温まってあげましょう"], "food": "きゅうり、梅"}, {"n": "芒種", "r": "ぼうしゅ", "m": 6, "d": 6, "body": "梅雨の前後です。湿気で体が重だるくなりやすくなります。", "tips": ["除湿と換気を、心がけてみてくださいね", "軽い運動で、汗を出すのもおすすめです", "香りのよいもので、気分転換をどうぞ"], "food": "梅、らっきょう"}, {"n": "夏至", "r": "げし", "m": 6, "d": 21, "body": "昼が一番長い日です。暑さで、眠りが浅くなりやすくなります。", "tips": ["お昼寝は、短めがおすすめです", "夕方の散歩は、気持ちがいいですよ", "酸味と苦みを、上手に取り入れてみてくださいね"], "food": "とうもろこし、すいか"}, {"n": "小暑", "r": "しょうしょ", "m": 7, "d": 7, "body": "本格的な暑さの始まりです。冷房と外気の差で、体が疲れやすくなります。", "tips": ["冷房は、控えめがおすすめです", "温かい飲み物も、取り入れてみてくださいね", "首にタオルを巻くと、冷えすぎを防げます"], "food": "枝豆、なす"}, {"n": "大暑", "r": "たいしょ", "m": 7, "d": 23, "body": "一年で一番暑い頃です。無理をしないことが、一番の養生です。", "tips": ["涼しい時間帯に動くのがおすすめです", "水分と塩分は、一緒にどうぞ", "疲れたら、横になって休んでくださいね"], "food": "ゴーヤ、冬瓜"}, {"n": "立秋", "r": "りっしゅう", "m": 8, "d": 7, "body": "秋の気配が立つ頃です。夏の疲れが出やすくなります。", "tips": ["胃腸を休める、温かい食事をどうぞ", "早寝を意識してみてくださいね", "お肌の乾燥ケアを、始める頃です"], "food": "梨、なす"}, {"n": "処暑", "r": "しょしょ", "m": 8, "d": 23, "body": "暑さが和らいでくる頃です。夏バテの回復期になります。", "tips": ["湯船で、ゆっくり温まってくださいね", "たんぱく質を、しっかりどうぞ", "軽いストレッチで、体をほぐしましょう"], "food": "さつまいも、さんま"}, {"n": "白露", "r": "はくろ", "m": 9, "d": 7, "body": "朝露の季節です。空気が乾き始めて、喉やお肌が敏感になりやすくなります。", "tips": ["加湿と水分補給を、心がけてくださいね", "白い食材は、潤いを助けてくれます", "夜更かしは、控えめがおすすめです"], "food": "梨、れんこん"}, {"n": "秋分", "r": "しゅうぶん", "m": 9, "d": 23, "body": "昼と夜の長さが同じになる日です。実りの季節で、食欲が増してきます。", "tips": ["よく噛んで、食べ過ぎに気をつけてくださいね", "お月見がてらの散歩も、いいですよ", "温かい汁物で、お腹を整えましょう"], "food": "きのこ、栗"}, {"n": "寒露", "r": "かんろ", "m": 10, "d": 8, "body": "冷たい露の頃です。冷えが、体に入りやすくなります。", "tips": ["首・お腹・足首を、温めてあげてくださいね", "朝食は、温かいものがおすすめです", "湯たんぽも、気持ちがいいですよ"], "food": "柿、生姜"}, {"n": "霜降", "r": "そうこう", "m": 10, "d": 23, "body": "霜の季節です。乾燥と冷えが進んで、風邪をひきやすくなります。", "tips": ["手洗いとうがいを、どうぞ", "お肌の保湿も、大切にしてくださいね", "根菜は、体を温めてくれます"], "food": "里芋、りんご"}, {"n": "立冬", "r": "りっとう", "m": 11, "d": 7, "body": "冬の始まりです。体を温めて、力を蓄える季節に入ります。", "tips": ["温かい食事を、中心にどうぞ", "早めにお布団に入ってくださいね", "日中は、日の光を浴びてみましょう"], "food": "大根、ねぎ"}, {"n": "小雪", "r": "しょうせつ", "m": 11, "d": 22, "body": "雪がちらつき始める頃です。冷えと乾燥で、体がこわばりやすくなります。", "tips": ["首と足首を、温めてあげてくださいね", "温かい飲み物を、どうぞ", "少し早めに休むのが、おすすめです"], "food": "白菜、みかん"}, {"n": "大雪", "r": "たいせつ", "m": 12, "d": 7, "body": "本格的な冬です。寒さで、巡りが滞りやすくなります。", "tips": ["手足をよく動かしてみてくださいね", "お風呂で、しっかり温まりましょう", "黒い食材は、栄養が豊富です"], "food": "黒豆、ごま"}, {"n": "冬至", "r": "とうじ", "m": 12, "d": 22, "body": "夜が一番長い日です。ゆっくり休んで、春への力を蓄える日です。", "tips": ["ゆず湯で、温まってくださいね", "「ん」の付く食べ物が、縁起がいいと言われています", "無理せず、休んで大丈夫ですよ"], "food": "かぼちゃ、ゆず"}, {"n": "小寒", "r": "しょうかん", "m": 1, "d": 6, "body": "寒の入りです。一年で一番寒い時期が始まります。", "tips": ["冷たい飲み物は、控えめがおすすめです", "腹巻きで、お腹を温めてあげましょう", "温かい鍋料理が、おすすめです"], "food": "七草、鍋の野菜"}, {"n": "大寒", "r": "だいかん", "m": 1, "d": 20, "body": "一年で一番寒い頃です。春への準備の期間でもあります。", "tips": ["体を温める食材を、取り入れてみてくださいね", "睡眠は、たっぷりどうぞ", "春の楽しみを考えるのも、養生ですよ"], "food": "卵、味噌などの発酵食品"}];
function idxFor(d){ var best=0; for(var i=0;i<DATA.length;i++){ var s=new Date(d.getFullYear(), DATA[i].m-1, DATA[i].d); if(d>=s) best=i; } if(d < new Date(d.getFullYear(),0,6)) { /* 小寒前は大雪/冬至側ではなく前年扱い: 1/1-1/5は冬至 */ } return best; }
function curIdx(){ var d=new Date(); var best=0, bestT=-1; for(var i=0;i<DATA.length;i++){ var t=new Date(d.getFullYear(), DATA[i].m-1, DATA[i].d); if(t>d) t=new Date(d.getFullYear()-1, DATA[i].m-1, DATA[i].d); if(t.getTime()>bestT){ bestT=t.getTime(); best=i; } } return best; }
var cur = curIdx();
function period(it, nx){ return it.m+"月"+it.d+"日ごろ 〜 "+nx.m+"月"+nx.d+"日ごろ"; }
function render(){ var it=DATA[cur], nx=DATA[(cur+1)%DATA.length];
  document.getElementById('card').innerHTML = '<div class="now-name">'+it.n+'<span class="r">'+it.r+'</span></div><div class="now-period">'+period(it,nx)+'</div><div class="now-body">'+it.body+'</div><div class="tips"><div class="tt">この季節のおすすめ</div><ul>'+it.tips.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul></div><div class="food">合う食べ物：'+it.food+'（旬辞典にもあります）</div>';
  var g=document.getElementById('grid'); g.innerHTML=''; DATA.forEach(function(x,i){ var b=document.createElement('button'); b.textContent=x.n; if(i===cur)b.className='on'; b.onclick=function(){cur=i;render();window.scrollTo({top:0,behavior:'auto'})}; g.appendChild(b); });
}
document.getElementById('prev').onclick=function(){cur=(cur+DATA.length-1)%DATA.length;render()};
document.getElementById('next').onclick=function(){cur=(cur+1)%DATA.length;render()};
render();
</script>
